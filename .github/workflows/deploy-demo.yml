name: Deploy demo

# The demo is a static bundle: analyze, the graph, the inspector and the patch
# engine are all `@codeflow/core`, which is browser-safe by design, so the only
# thing a host has to do is serve files. The two server-shaped features degrade
# explicitly in this build — see apps/demo/src/deployment.ts.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'codeflow-team/codeflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Emits `base_path`, which is `/<repo>` for a project Page. The demo's
      # vite.config.ts sets no `base`, so it has to come from here or every
      # asset URL on the deployed site is wrong.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build the packages the demo imports
        # Not `pnpm build`: that would also produce the *local* demo build,
        # which the next step immediately overwrites with the public one.
        run: pnpm exec turbo run build --filter='!demo'

      - name: Build the public demo
        working-directory: apps/demo
        env:
          # Read by src/deployment.ts. It is what makes this build say "Run is
          # local only" instead of hiding the button, and what makes the AI
          # panel ask the visitor for their own key instead of a dev server's.
          VITE_PUBLIC_DEMO: "1"
          VITE_REPO_URL: https://github.com/${{ github.repository }}
        run: pnpm exec vite build --base="${{ steps.pages.outputs.base_path }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
