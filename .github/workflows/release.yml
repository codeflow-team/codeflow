name: Release

# Runs on every push to main, but publishes *nothing* unless a version in
# packages/*/package.json is not yet on the registry. So a normal commit is a
# no-op; bumping a version and merging is the release.
#
# ## How it authenticates
#
# Preferred: **trusted publishing** (OIDC). npm exchanges the short-lived token
# GitHub mints for this workflow run for publish credentials, so there is no
# long-lived secret to leak, rotate or forget. It requires `id-token: write`
# below, npm CLI ≥ 11.5.1, Node ≥ 22.14, and a trusted publisher configured on
# npmjs.com for each package — naming this repository AND this file by name
# (`release.yml`, matched case-sensitively). See RELEASING.md.
#
# Fallback: a **granular access token** in the `NPM_TOKEN` secret. This is not
# redundancy for its own sake — a trusted publisher is configured on a package's
# settings page, and a package that has never been published has no settings
# page. So the very first publish of each package needs the token; every publish
# after it should not. Remove the secret once all five packages exist.
#
# (Classic automation tokens were removed from npm in November 2025; if you are
# following an older guide that says "automation token", it means a granular
# access token with publish permission now.)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  # Mints the OIDC token that trusted publishing exchanges, and the one npm
  # provenance is signed against. Without it, both silently fall back.
  id-token: write

jobs:
  publish:
    # A fork must never try to publish with its own secrets or fail loudly on a
    # missing one. Change this if the repository is renamed or moved.
    if: github.repository == 'codeflow-team/codeflow'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from `packageManager` in the root package.json.

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node ≥ 22.14; 24 is the current LTS line and
          # ships an npm new enough to be upgraded in place below.
          node-version: "24"
          # Deliberately no dependency cache on a release build: a release must
          # be reproducible from the lockfile and the registry, not from
          # whatever a previous run happened to leave behind.
          #
          # And deliberately no `registry-url`: that option writes its own
          # `.npmrc` into RUNNER_TEMP containing `_authToken=${NODE_AUTH_TOKEN}`
          # and repoints `NPM_CONFIG_USERCONFIG` at it. Two consequences, both
          # bad here — the auth line written below would be read from a file npm
          # is no longer looking at, and `pnpm install` would meet an
          # unresolvable placeholder and discard that config wholesale. The
          # registry is already pinned for this scope in the repository's own
          # .npmrc, and npmjs.org is npm's default besides.

      - name: Require an npm new enough to exchange an OIDC token
        # 11.5.1 is the floor for trusted publishing. Pinning to `latest` rather
        # than a fixed version because the floor only ever rises, and a release
        # that silently published *without* OIDC would be worse than one that
        # fails here.
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Choose an authentication mode
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            # Written to the *user* config, and written as the literal string
            # `${NPM_TOKEN}` so the token itself never lands on disk — npm
            # substitutes it from the environment at the moment it is needed.
            #
            # Not the repository's own .npmrc: pnpm discards an entire .npmrc it
            # cannot resolve an env placeholder in, which would take the
            # `@codeflow-team:registry` line down with it for every contributor who
            # has no NPM_TOKEN. Verified, not assumed.
            #
            # `NPM_CONFIG_USERCONFIG` is honoured in case something upstream
            # repointed it; otherwise this is plain `~/.npmrc`.
            printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' >> "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing with the NPM_TOKEN secret. Once every package exists on the registry, configure a trusted publisher for each and delete the secret."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing with trusted publishing (OIDC) — no long-lived secret in play."
          fi

      - name: Publish packages whose version is not on the registry yet
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          published=0
          skipped=""
          # Order matters: the other four depend on @codeflow-team/core, so it has to
          # be on the registry before they are installable. Within one run that
          # is just this loop's order.
          for p in core react cli mcp examples; do
            dir="packages/$p"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip  $name@$version — already on the registry"
              skipped="$skipped $name@$version"
              continue
            fi

            # `pnpm pack` (not `npm pack`) rewrites the `workspace:` protocol in
            # the packed manifest into a real version range. `npm publish` then
            # uploads that finished tarball, which is also what performs the OIDC
            # exchange — pnpm's own publish does not speak trusted publishing.
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/dist")
            tarball=$(ls -t "$RUNNER_TEMP"/dist/*.tgz | head -1)

            # A `workspace:` specifier that survived into a tarball produces a
            # package nobody can install. CI checks this too; it is repeated here
            # because this is the irreversible step.
            if tar -xzOf "$tarball" package/package.json | grep -q '"workspace:'; then
              echo "::error::$name@$version still contains a workspace: specifier — not publishing"
              exit 1
            fi

            echo "publish  $name@$version  (auth: ${{ steps.auth.outputs.mode }})"
            # `--access public` because the scope's default for a new package is
            # restricted. `--provenance` is the default under trusted publishing
            # and is passed explicitly so the token path produces it too.
            npm publish "$tarball" --access public --provenance
            rm -f "$tarball"
            published=$((published + 1))
          done

          echo "published $published package(s)"
          {
            echo "PUBLISHED=$published"
            echo "SKIPPED=$skipped"
          } >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release"
            echo ""
            echo "Published **${PUBLISHED:-0}** package(s) from \`${GITHUB_SHA:0:7}\`, authenticating with **${{ steps.auth.outputs.mode }}**."
            echo ""
            if [ -n "${SKIPPED:-}" ]; then
              echo "Already on the registry, so left alone:${SKIPPED}"
              echo ""
            fi
            echo "A run that publishes 0 packages is the expected outcome for a commit"
            echo "that did not bump a version."
          } >> "$GITHUB_STEP_SUMMARY"
